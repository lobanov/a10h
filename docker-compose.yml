# Pi Autoresearch Lab — deployment (DESIGN.md §4).
#
#   Hub only:        docker compose up -d postgres hub
#   + workers (demo): docker compose --profile worker up -d
#   + LiteLLM:       docker compose --profile litellm up -d   (optional)
#
# Copy .env.example to .env first (see scripts/gen-env.sh to import the
# local pi provider config).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoresearch-dev}
      POSTGRES_DB: ${POSTGRES_DB:-autoresearch}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    ports:
      # Localhost-bound for dev tooling (BDD suites, psql). Not exposed externally.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoresearch}"]
      interval: 2s
      timeout: 3s
      retries: 30

  hub:
    build: ./hub
    ports:
      - "${HUB_PORT:-8080}:8080"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-autoresearch}
      PGPASSWORD: ${POSTGRES_PASSWORD:-autoresearch-dev}
      PGDATABASE: ${POSTGRES_DB:-autoresearch}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      Z_AI_API_KEY: ${Z_AI_API_KEY:-}
      Z_AI_BASE_URL: ${Z_AI_BASE_URL:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-gemma-4-26b-it}
      AUDITOR_MODEL: ${AUDITOR_MODEL:-local/gemma-4-26b-it}
      DIRECTOR_MODEL: ${DIRECTOR_MODEL:-z.ai/glm-5.3}
      # Git plane (R1): bare repos + token policy served/read hub-side; hub API
      # under the same internal CA as the gitserver.
      REPOS_DIR: /data/repos
      POLICY_PATH: /data/git/policy.json
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal}
      TLS_CERT_PATH: /data/git/tls/hub.crt
      TLS_KEY_PATH: /data/git/tls/hub.key
      HF_STORE_PATH: /hf-store
    volumes:
      # Framework repo (contains examples/demo-project) — read-only reference.
      - ${PWD}:/repo:ro
      # Git plane: bare repos (rw — merges/sync write), CA+policy+certs (ro).
      - ./data/repos:/data/repos
      - ./data/git:/data/git:ro
      # HF artifact store (hub-side mount; workers share the same path).
      - ./data/hf-store:/hf-store
    depends_on:
      postgres:
        condition: service_healthy

  gitserver:
    # Serves bare research repos over smart HTTPS (R1). Requires
    # scripts/bootstrap-git.sh to have generated data/git/{ca,tls} and seeded
    # data/repos/*.git.
    build: ./gitserver
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal}
    volumes:
      - ./data/repos:/data/repos
      - ./data/git:/data/git:ro
    depends_on:
      - hub

  worker-a:
    build: ./worker
    profiles: ["worker"]
    restart: always
    environment:
      HUB_URL: https://hub:8080
      NODE_EXTRA_CA_CERTS: /data/git/ca/ca.crt
      NODE_ID: worker-a
      NODE_TAGS: ${NODE_A_TAGS:-cpu:8,mem:8G}
      WORK_DIR: /work
      # Git plane (R1/R3): clone/push via gitserver with CA trust + worker token.
      GITSERVER_URL: https://gitserver
      GIT_SSL_CAINFO: /data/git/ca/ca.crt
      GIT_TOKEN_FILE: /data/git/tokens/worker-a.token
      HF_STORE_PATH: /hf-store
      # Hub API auth (single-operator token; same as the dashboard's).
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    volumes:
      - ./data/work-a:/work
      # Least privilege: only the CA cert + THIS node's git token (never the
      # CA key, server keys, or other nodes' tokens).
      - ./data/git/ca/ca.crt:/data/git/ca/ca.crt:ro
      - ./data/git/tokens/worker-a.token:/data/git/tokens/worker-a.token:ro
      - ./data/hf-store:/hf-store
    depends_on:
      - hub
      - gitserver

  worker-b:
    build: ./worker
    profiles: ["worker"]
    restart: always
    environment:
      HUB_URL: https://hub:8080
      NODE_EXTRA_CA_CERTS: /data/git/ca/ca.crt
      NODE_ID: worker-b
      NODE_TAGS: ${NODE_B_TAGS:-cpu:8,mem:8G}
      WORK_DIR: /work
      GITSERVER_URL: https://gitserver
      GIT_SSL_CAINFO: /data/git/ca/ca.crt
      GIT_TOKEN_FILE: /data/git/tokens/worker-b.token
      HF_STORE_PATH: /hf-store
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    volumes:
      - ./data/work-b:/work
      - ./data/git/ca/ca.crt:/data/git/ca/ca.crt:ro
      - ./data/git/tokens/worker-b.token:/data/git/tokens/worker-b.token:ro
      - ./data/hf-store:/hf-store
    depends_on:
      - hub
      - gitserver

  llamacpp:
    # Local auditor model (DESIGN.md §3.5 tier `local`). unsloth GGUF quants
    # target llama.cpp (vLLM 0.27 has no GGUF path); llama-server exposes the
    # same OpenAI-compatible API on :8000/v1.
    # Requires ./data/vllm-models/model/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
    # (see scripts/fetch-models.sh).
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["local-llm"]
    volumes:
      - ./data/vllm-models:/models:ro
    command:
      - "-m"
      - "/models/model/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf"
      - "--port"
      - "8000"
      - "-c"
      - "8192"
      - "-ngl"
      - "99"
      - "--alias"
      - "gemma-4-26b-it"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || wget -qO- http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["litellm"]
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
