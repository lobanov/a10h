# Pi Autoresearch Lab — deployment (DESIGN.md §4).
#
#   Hub only:        docker compose up -d postgres hub
#   + workers (demo): docker compose --profile worker up -d
#   + LiteLLM:       docker compose --profile litellm up -d   (optional)
#
# Copy .env.example to .env first (see scripts/gen-env.sh to import the
# local pi provider config).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoresearch-dev}
      POSTGRES_DB: ${POSTGRES_DB:-autoresearch}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    ports:
      # Localhost-bound for dev tooling (BDD suites, psql). Not exposed externally.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoresearch}"]
      interval: 2s
      timeout: 3s
      retries: 30

  hub:
    build: ./hub
    ports:
      - "${HUB_PORT:-8080}:8080"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-autoresearch}
      PGPASSWORD: ${POSTGRES_PASSWORD:-autoresearch-dev}
      PGDATABASE: ${POSTGRES_DB:-autoresearch}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      Z_AI_API_KEY: ${Z_AI_API_KEY:-}
      Z_AI_BASE_URL: ${Z_AI_BASE_URL:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-gemma-4-26b-it}
      AUDITOR_MODEL: ${AUDITOR_MODEL:-local/gemma-4-26b-it}
      DIRECTOR_MODEL: ${DIRECTOR_MODEL:-z.ai/glm-5.3}
    volumes:
      # Framework repo (contains examples/demo-project) — read-only reference.
      - ${PWD}:/repo:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker-a:
    build: ./worker
    profiles: ["worker"]
    environment:
      HUB_URL: http://hub:8080
      NODE_ID: worker-a
      NODE_TAGS: ${NODE_A_TAGS:-cpu:8,mem:8G}
      REPO_PATH: /repo
      CHECKOUT_STRATEGY: clone
      WORK_DIR: /work
      HOST_WORK_DIR: ${PWD}/data/work-a
    volumes:
      - ${PWD}:/repo:ro
      - ./data/work-a:/work
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - hub

  worker-b:
    build: ./worker
    profiles: ["worker"]
    environment:
      HUB_URL: http://hub:8080
      NODE_ID: worker-b
      NODE_TAGS: ${NODE_B_TAGS:-cpu:8,mem:8G}
      REPO_PATH: /repo
      CHECKOUT_STRATEGY: clone
      WORK_DIR: /work
      HOST_WORK_DIR: ${PWD}/data/work-b
    volumes:
      - ${PWD}:/repo:ro
      - ./data/work-b:/work
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - hub

  llamacpp:
    # Local auditor model (DESIGN.md §3.5 tier `local`). unsloth GGUF quants
    # target llama.cpp (vLLM 0.27 has no GGUF path); llama-server exposes the
    # same OpenAI-compatible API on :8000/v1.
    # Requires ./data/vllm-models/model/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
    # (see scripts/fetch-models.sh).
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["local-llm"]
    volumes:
      - ./data/vllm-models:/models:ro
    command:
      - "-m"
      - "/models/model/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf"
      - "--port"
      - "8000"
      - "-c"
      - "8192"
      - "-ngl"
      - "99"
      - "--alias"
      - "gemma-4-26b-it"
      - "--jinja"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || wget -qO- http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["litellm"]
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
