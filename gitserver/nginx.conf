# Gitserver vhost (DESIGN.md §3.2.1). TLS + token auth via the hub + smart HTTP.
# Repo name extracted per-request in the location (named capture).
server {
  listen 443 ssl;
  server_name gitserver;

  ssl_certificate     /data/git/tls/gitserver.crt;
  ssl_certificate_key /data/git/tls/gitserver.key;

  # Pack files can be large; disable nginx body limits and raise timeouts.
  client_max_body_size 0;
  fastcgi_read_timeout 300s;

  # 401 from the auth subrequest must carry a Basic challenge for git clients.
  error_page 401 = @unauthenticated;

  location = /_gitauth {
    internal;
    # Hub serves TLS under the same internal CA (R1). Resolve at request
    # time (docker DNS) so hub restarts/IP changes don't strand nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $hub_upstream https://hub:8080;
    rewrite ^ /internal/git/auth break;
    proxy_pass $hub_upstream;
    proxy_ssl_name hub;
    proxy_ssl_server_name on;
    proxy_ssl_trusted_certificate /data/git/ca/ca.crt;
    proxy_ssl_verify on;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Repo $git_repo;
  }

  location @unauthenticated {
    default_type text/plain;
    add_header WWW-Authenticate 'Basic realm="autoresearch-git"' always;
    return 401 "authentication required\n";
  }

  # All git smart-HTTP traffic: /<repo>.git/info/refs, git-upload-pack,
  # git-receive-pack.
  location ~ ^/(?<git_repo>[^/]+\.git)(/.*)?$ {
    auth_request /_gitauth;
    auth_request_set $git_token $upstream_http_x_git_token;
    auth_request_set $git_role $upstream_http_x_git_role;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
    fastcgi_param GIT_PROJECT_ROOT /data/repos;
    fastcgi_param GIT_HTTP_EXPORT_ALL "1";
    fastcgi_param PATH_INFO $fastcgi_script_name;
    fastcgi_param REMOTE_USER $git_token;
    fastcgi_param REMOTE_ROLE $git_role;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_pass unix:/var/run/fcgiwrap/fcgiwrap.socket;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
